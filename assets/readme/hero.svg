    <g transform="translate(20, 50)">
      <rect width="505" height="68" rx="8" fill="#101726" stroke="#1E293B" stroke-width="1"/>
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#64748B">TRACK 1: 原始波形与 VAD 自适应死寂检测</text>
      
      <!-- Waveform representation -->
      <!-- Spoken 1 -->
      <path d="M 12 42 Q 22 26 32 42 T 52 42 T 72 42 T 92 42 T 112 42 T 132 42 T 152 42" fill="none" stroke="#38BDF8" stroke-width="2"/>
      <!-- Silence Cut (Red highlight) -->
      <rect x="160" y="24" width="85" height="36" rx="4" fill="url(#cutGrad)" stroke="#EF4444" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="175" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#EF4444">✂ 停顿死等</text>
      <!-- Spoken 2 (Stumble) -->
      <path d="M 255 42 Q 265 30 275 42 T 295 42 T 315 42 T 335 42 T 355 42" fill="none" stroke="#F87171" stroke-width="2"/>
      <!-- Silence Cut 2 -->
      <rect x="365" y="24" width="45" height="36" rx="4" fill="url(#cutGrad)" stroke="#EF4444" stroke-width="1" stroke-dasharray="3 3"/>
      <!-- Spoken 3 (Clean) -->
      <path d="M 420 42 Q 430 24 440 42 T 460 42 T 480 42 T 495 42" fill="none" stroke="#34D399" stroke-width="2"/>
    </g>

    <!-- Track 2: ASR Word Protection & Semantic Mistake Elimination -->
    <g transform="translate(20, 130)">
