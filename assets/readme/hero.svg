        <rect width="125" height="32" rx="4" fill="#450A0A" stroke="#EF4444" stroke-width="1"/>
        <text x="10" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#FCA5A5">✖ 口误推倒重讲</text>
      </g>

      <!-- Clean restart word box -->
      <g transform="translate(415, 28)">
        <rect width="78" height="32" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
        <text x="8" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#ECFDF5">定版新起句</text>
      </g>
    </g>

    <!-- Track 3: Final Seamless Reconstructed Timeline -->
    <g transform="translate(20, 216)">
      <rect width="505" height="66" rx="8" fill="#101726" stroke="#1E293B" stroke-width="1"/>
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#64748B">TRACK 3: 硬件微淡化无缝重组成片 (Crossfade 15ms)</text>

      <!-- Assembled slices -->
      <g transform="translate(12, 26)">
        <rect width="210" height="28" rx="5" fill="#065F46" stroke="#34D399" stroke-width="1"/>
        <text x="16" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#ECFDF5">Slice 1 · 紧凑原声</text>
      </g>
      <!-- Crossfade joint badge -->
      <g transform="translate(216, 26)">
        <circle cx="10" cy="14" r="8" fill="#0284C7"/>
        <text x="6" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold" fill="#FFF">⇄</text>
      </g>
      <g transform="translate(230, 26)">
        <rect width="263" height="28" rx="5" fill="#065F46" stroke="#34D399" stroke-width="1"/>
        <text x="16" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#ECFDF5">Slice 2 · 订正重录句 (无缝过渡)</text>
      </g>
    </g>

    <!-- Bottom summary stats bar -->
    <g transform="translate(20, 296)">
      <rect width="505" height="44" rx="8" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="27" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="12" fill="#94A3B8">PROVEN PERFORMANCE:</text>
      <text x="185" y="27" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="12" font-weight="bold" fill="#38BDF8">53m 原片 → 20m 紧凑成片 (省时 62%)</text>
      <circle cx="485" cy="22" r="4" fill="#10B981"/>
    </g>
  </g>
</svg>
