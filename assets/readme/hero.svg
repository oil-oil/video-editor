      <circle cx="30" cy="23" r="4" fill="#F59E0B"/>
      <circle cx="42" cy="23" r="4" fill="#10B981"/>
      <text x="62" y="28" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="14" fill="#94A3B8">npx skills add oil-oil/video-editor</text>
      <rect x="442" y="10" width="50" height="26" rx="6" fill="#1E293B"/>
      <text x="454" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">CLI</text>
    </g>
