<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">video-editor - 智能通用视频粗剪与口误废案剔除</title>
  <desc id="desc">全自动通用视频粗剪工具：基于 Silero VAD、自适应能量底噪与 Qwen 3.8 Omni Flash 大模型滑窗，精准切除死寂停顿与重复口误，硬件微淡化导出无爆音成片。</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#0D1424"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="cutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="keepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="440" rx="24" fill="url(#bgGrad)"/>
  <rect width="1200" height="440" rx="24" fill="url(#glow)"/>
  <rect width="1196" height="436" x="2" y="2" rx="22" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Left: Title & Product Value -->
  <g transform="translate(60, 52)">
    <!-- Category Badge -->
    <g>
      <rect width="260" height="28" rx="14" fill="#0F243A" stroke="#0284C7" stroke-width="1"/>
      <circle cx="14" cy="14" r="4" fill="#38BDF8"/>
      <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#38BDF8" letter-spacing="0.8">AI VIDEO ROUGH-CUT SKILL</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="46" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">video-editor</text>
    
    <!-- Subtitle -->
    <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" font-weight="500" fill="#94A3B8">现成通用视频智能粗剪 · 停顿死寂消除 · 口误废案剔除</text>
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="14" font-weight="400" fill="#64748B">无需绑定工程文件 · 支持 MP4 / MOV / MKV · 原生硬件微淡化导出</text>

    <!-- Feature Value Tags -->
    <g transform="translate(0, 172)">
      <!-- Tag 1 -->
      <g>
        <rect width="245" height="34" rx="8" fill="#131D2E" stroke="#1E293B" stroke-width="1"/>
        <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#38BDF8">🎯 92.3% 跨工程宏观精确度</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(255, 0)">
        <rect width="250" height="34" rx="8" fill="#131D2E" stroke="#1E293B" stroke-width="1"/>
        <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#10B981">🛡️ 字级 ASR 保护 · 严防误切吞字</text>
      </g>
    </g>
    <g transform="translate(0, 214)">
      <!-- Tag 3 -->
      <g>
        <rect width="245" height="34" rx="8" fill="#131D2E" stroke="#1E293B" stroke-width="1"/>
        <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#A855F7">🧠 Qwen 3.8 Omni 滑窗推理</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(255, 0)">
        <rect width="250" height="34" rx="8" fill="#131D2E" stroke="#1E293B" stroke-width="1"/>
        <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#F59E0B">🔊 15ms 接缝微淡化 · 彻底杜绝爆音</text>
      </g>
    </g>

