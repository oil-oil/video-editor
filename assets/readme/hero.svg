      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#64748B">TRACK 2: 字级保护垫与 Qwen 3.8 Omni 口误识别</text>
      
      <!-- Word boxes with 60ms protection pads -->
      <g transform="translate(12, 28)">
        <rect width="68" height="32" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
        <text x="8" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#ECFDF5">有效讲解</text>
        <rect x="74" y="28" width="62" height="32" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
        <text x="82" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#ECFDF5">内容保护</text>
      </g>
      
      <!-- Semantic Mistake Cut -->
